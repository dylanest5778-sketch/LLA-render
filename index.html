<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLA Render Prompt Batcher</title>
<style>body{font-family:Microsoft YaHei,Arial,sans-serif;background:#f3f5f4;color:#18201d;margin:0;display:grid;place-items:center;min-height:100vh}.box{background:white;border:1px solid #d7dfdb;border-radius:14px;padding:24px;max-width:600px;box-shadow:0 2px 10px rgba(0,0,0,.03)}.muted{color:#66726c;font-size:13px;line-height:1.7}</style>
</head>
<body>
<div class="box"><h2>LLA Render Prompt Batcher</h2><div class="muted" id="msg">正在载入正式版…</div></div>
<script>
(async()=>{
  try{
    const files=Array.from({length:8},(_,i)=>`./payload/part${String(i+1).padStart(2,'0')}.txt?ts=${Date.now()}`);
    const parts=await Promise.all(files.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('payload '+r.status);return r.text()})));
    const t=parts.join('').trim();
    const bin=Uint8Array.from(atob(t),c=>c.charCodeAt(0));
    if(!('DecompressionStream' in window)) throw new Error('browser');
    const ds=new DecompressionStream('gzip');
    const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
    if(!html.includes('<!DOCTYPE html>')&&!html.includes('<html')) throw new Error('invalid html');
    document.open();document.write(html);document.close();
  }catch(e){
    console.error(e);
    document.getElementById('msg').textContent='载入失败。请强制刷新（Ctrl+F5）。若仍失败，请联系 LLA。';
  }
})();
</script>
</body>
</html>
